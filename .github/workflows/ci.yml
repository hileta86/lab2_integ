name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pip install ruff==0.5.1
          ruff check src/ scripts/

      - name: Build image
        run: |
          docker build \
            --build-arg EPOCHS=10 \
            --build-arg MAX_SAMPLES_PER_CLASS=0 \
            --build-arg MODEL_VERSION=${{ github.sha }} \
            -t kws-api:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d --name kws -p 8000:8000 kws-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Smoke test & quality gate
        run: |
          curl -sf http://localhost:8000/model-info | tee model_info.json
          curl -sf -X POST -F "file=@samples/yes.wav" http://localhost:8000/predict | tee predict_yes.json
          ACC=$(curl -s http://localhost:8000/model-info | jq '.accuracy')
          echo "accuracy=$ACC"
          python -c "import sys; sys.exit(0 if $ACC >= 99 else 1)"

      - name: Logs on failure
        if: failure()
        run: docker logs kws
